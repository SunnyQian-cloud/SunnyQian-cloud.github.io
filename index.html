<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141414">
  <meta name="description" content="Blockwise: what to work on next, for how long, and why.">
  <meta name="referrer" content="no-referrer">
  <title>Blockwise</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fd6'/%3E%3Crect x='14' y='16' width='36' height='9' rx='3' fill='%23f6f4ef'/%3E%3Crect x='14' y='29' width='24' height='9' rx='3' fill='%237eaeff'/%3E%3Crect x='14' y='42' width='30' height='9' rx='3' fill='%23f6f4ef' opacity='.7'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Blockwise">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Blockwise</span>
      <span id="mode-pill" class="pill pill-demo" hidden>Example</span>
    </div>
    <nav class="top-nav" aria-label="Main">
      <button type="button" class="nav-btn" data-view="today">Today</button>
      <button type="button" class="nav-btn" data-view="week">Week</button>
    </nav>
    <div class="header-actions">
      <button type="button" id="schedule-btn" class="btn btn-ghost btn-schedule">Edit schedule</button>
      <button type="button" id="add-btn" class="btn btn-primary btn-add">+ Add task</button>
      <button type="button" id="more-btn" class="btn btn-icon" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
  </header>

  <div id="banners" class="banners" aria-live="polite"></div>

  <main id="main" tabindex="-1">
    <noscript><p class="card">Blockwise needs JavaScript turned on.</p></noscript>
    <section id="view-today" class="view" aria-labelledby="today-title"></section>
    <section id="view-week" class="view" aria-labelledby="week-title" hidden></section>
  </main>

  <nav class="bottom-nav" aria-label="Main">
    <button type="button" class="nav-btn" data-view="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
      <span>Today</span>
    </button>
    <button type="button" class="nav-btn" data-view="week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Week</span>
    </button>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button type="button" class="btn btn-icon sheet-close" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </dialog>

  <dialog id="confirm" class="confirm" aria-labelledby="confirm-title">
    <form method="dialog" class="confirm-inner">
      <h2 id="confirm-title"></h2>
      <div id="confirm-body"></div>
      <div class="actions">
        <button type="submit" value="cancel" class="btn btn-secondary" id="confirm-cancel">Cancel</button>
        <button type="submit" value="ok" class="btn btn-primary" id="confirm-ok">OK</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
